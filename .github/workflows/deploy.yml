name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* vars are baked into the bundle at build time, so they
      # must be present HERE, not at runtime. None of these are secret.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_CALENDLY_URL: ${{ vars.NEXT_PUBLIC_CALENDLY_URL }}

      # GitHub Pages serves the root 404.html for any unmatched path, but with
      # trailingSlash: true the App Router export writes 404/index.html instead.
      # Copy it into place if the root file is missing. Harmless if it isn't.
      - name: Ensure root 404.html
        run: |
          if [ ! -f out/404.html ] && [ -f out/404/index.html ]; then
            cp out/404/index.html out/404.html
            echo "copied out/404/index.html -> out/404.html"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
